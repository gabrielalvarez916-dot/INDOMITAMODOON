<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="css/plataforma.css">
<title>Indómita Modo On · Cursos</title>
</head>
<body class="pl">
<header class="pl-header">
  <div class="pl-header__inner">
    <a class="pl-logo pl-logo--header" href="cursos.html" aria-label="Indómita Modo On — inicio">
      <span aria-hidden="true">MODO</span><span class="pl-switch" aria-hidden="true"><span class="pl-switch__knob"></span></span><span aria-hidden="true">N</span>
    </a>
    <button class="pl-salir" id="logout" type="button">Salir</button>
  </div>
</header>
<main>
  <!-- Banner publicitario (4:1, imagen o video) -->
  <div class="pl-banner" id="banner" aria-label="Publicidad"></div>

  <div class="pl-contenedor">
    <section class="pl-toolbar" aria-label="Buscar y filtrar cursos">
      <div class="pl-buscador">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="buscar" type="search" placeholder="Buscar por curso o docente" autocomplete="off" aria-label="Buscar cursos">
        <button id="buscar-borrar" type="button" aria-label="Borrar búsqueda" hidden>✕</button>
      </div>
      <div class="pl-chips" id="chips" role="group" aria-label="Tipo de curso"></div>
    </section>

    <p class="pl-contador" id="contador" aria-live="polite"></p>
    <div class="pl-grid" id="grid"></div>
    <div id="estado"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/tarjetas.js"></script>
<script src="js/cursos.js"></script>
</body>
</html>
